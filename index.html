<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoramento Backoffice</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1B1C2E;
    font-family: Arial, sans-serif;
}

.header {
    height: 34px;
    background: #1B1C2E;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 15px;
    font-size: 18px;
    font-weight: bold;
}

.container {
    width: 100vw;
    height: calc(100vh - 48px);
    overflow: hidden;
    background: #1B1C2E;
    position: relative;
}

/* elimina a faixa branca da direita */
iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% + 25px);
    height: 100%;
    border: none;
    display: block;
    margin-right: -25px;
}
</style>

</head>
<body>

<div class="header">
    Power BI - Backoffice Monitoreo
</div>

<div class="container">
    <iframe
        title="Power_BI_Backoffice_Monitoreo"
        src="https://app.powerbi.com/reportEmbed?reportId=e129fa4b-e279-4593-867a-56243957ce56&appId=24e66b81-14f8-405b-acd7-787177f33398&autoAuth=true&ctid=4abdf8c8-91c3-4c1b-9c71-6266b586ec6b&navContentPaneEnabled=false"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
